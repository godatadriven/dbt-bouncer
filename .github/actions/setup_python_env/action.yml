name: 'Setup python environment'
description: 'Setup python environment'

inputs:
  install-python-deps:
    default: 'true'
    description: 'Install python dependencies'
    required: false
  python-version:
    default: ''
    description: 'Python version (defaults to .python-version file)'
    required: false

outputs:
  python-version:
    description: 'Resolved Python version'
    value: ${{ steps.resolve-version.outputs.python-version }}

runs:
  using: "composite"
  steps:
    - name: Resolve Python version
      id: resolve-version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.python-version }}
      run: |
        if [ -n "$INPUT_VERSION" ]; then
          VERSION="$INPUT_VERSION"
        else
          VERSION=$(cat .python-version)
        fi
        echo "python-version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "UV_PYTHON=$VERSION" >> "$GITHUB_ENV"

    - name: Setup Python
      id: setup-python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ steps.resolve-version.outputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        cache-suffix: py${{ steps.resolve-version.outputs.python-version }}
        enable-cache: true

    - name: Setup mise
      uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      with:
        install: false

    - name: Install dependencies
      if: inputs.install-python-deps == 'true'
      shell: bash
      run: mise run install
