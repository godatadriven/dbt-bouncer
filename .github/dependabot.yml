---
version: 2
updates:
    - package-ecosystem: github-actions
      cooldown:
        default-days: 14
      # "/" scans .github/workflows; the globs cover composite actions under
      # .github/actions, which the "/" root does not reach.
      directories:
        - /
        - /.github/actions/*
      schedule:
          interval: monthly
    - package-ecosystem: pip
      cooldown:
        default-days: 14
      directory: /
      ignore:
        - dependency-name: "*"
          update-types: ["version-update:semver-patch"]
      schedule:
          interval: monthly
