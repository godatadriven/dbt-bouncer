---
    name: dbt artifacts probe

    on:
      schedule:
        - cron: '0 6 * * *'
      workflow_dispatch:

    env:
      DBT_PROFILES_DIR: dbt_project
      DBT_PROJECT_DIR: dbt_project

    jobs:
        dbt-cloud:
            permissions:
              contents: read
            runs-on: ubuntu-24.04
            steps:
                - name: Checkout
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                  with:
                    persist-credentials: false

                - name: Setup Python
                  uses: ./.github/actions/setup_python_env

                - name: Trigger dbt Cloud job and download artifacts
                  run: ./scripts/get_dbt_cloud_artifacts.sh
                  env:
                    DBT_ACCOUNT_ID: ${{ secrets.DBT_ACCOUNT_ID }}
                    DBT_CLOUD_JOB_ID: ${{ secrets.DBT_CLOUD_JOB_ID }}
                    DBT_TOKEN_VALUE: ${{ secrets.DBT_TOKEN_VALUE }}

                - name: Run `dbt-bouncer`
                  run: uv run dbt-bouncer --config-file ./dbt-bouncer-example.yml

        dbt-core:
            permissions:
              contents: read
            runs-on: ubuntu-24.04
            steps:
                - name: Checkout
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                  with:
                    persist-credentials: false

                - name: Setup Python
                  uses: ./.github/actions/setup_python_env

                # The project venv pins dbt 2.0, so this job covers the legacy dbt-core
                # 1.x line instead. The task installs the newest 1.x release in an
                # isolated uvx environment, which leaves the venv untouched.
                - name: Regenerate dbt artifacts and run `dbt-bouncer`
                  run: |
                    (r=3;while ! mise run build-and-run-dbt-bouncer-dbt1 ; do ((--r))||exit;done)

        dbt-2:
            permissions:
              contents: read
            runs-on: ubuntu-24.04
            steps:
                - name: Checkout
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                  with:
                    persist-credentials: false

                - name: Setup Python
                  uses: ./.github/actions/setup_python_env

                # uv.lock pins one dbt 2.0 patch release. This step upgrades the venv to
                # the newest 2.x release, so the probe catches artifact drift before the
                # lockfile moves.
                - name: Install latest released dbt 2.x
                  run: uv run pip install "dbt<3" -U

                - name: Regenerate dbt artifacts and run `dbt-bouncer`
                  run: |
                    (r=3;while ! mise run build-and-run-dbt-bouncer ; do ((--r))||exit;done)

        dbt-fusion:
            permissions:
              contents: read
            runs-on: ubuntu-24.04
            steps:
                - name: Checkout
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                  with:
                    persist-credentials: false

                - name: Setup Python
                  uses: ./.github/actions/setup_python_env

                - name: Install latest native dbt Fusion CLI
                  run: |
                    export SHELL=/bin/bash
                    curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh | sh -s -- --update
                    echo "$HOME/.local/bin" >> "$GITHUB_PATH"
                    # Log the installed version. The probe tracks the latest Fusion
                    # release on purpose, so this makes drift failures easy to trace.
                    "$HOME/.local/bin/dbt" --version

                - name: Regenerate dbt artifacts and run `dbt-bouncer`
                  run: |
                    (r=3;while ! mise run build-and-run-dbt-bouncer-fusion ; do ((--r))||exit;done)
