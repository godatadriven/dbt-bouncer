---
    name: dbt artifacts probe

    on:
      schedule:
        - cron: '0 6 * * *'
      workflow_dispatch:

    env:
      DBT_PROFILES_DIR: dbt_project
      DBT_PROJECT_DIR: dbt_project

    jobs:
        dbt-cloud:
            permissions:
              contents: read
            runs-on: ubuntu-24.04
            steps:
                - name: Checkout
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                  with:
                    persist-credentials: false

                - name: Setup Python
                  uses: ./.github/actions/setup_python_env

                - name: Trigger dbt Cloud job and download artifacts
                  run: ./scripts/get_dbt_cloud_artifacts.sh
                  env:
                    DBT_ACCOUNT_ID: ${{ secrets.DBT_ACCOUNT_ID }}
                    DBT_CLOUD_JOB_ID: ${{ secrets.DBT_CLOUD_JOB_ID }}
                    DBT_TOKEN_VALUE: ${{ secrets.DBT_TOKEN_VALUE }}

                - name: Run `dbt-bouncer`
                  run: uv run dbt-bouncer --config-file ./dbt-bouncer-example.yml

        dbt-core:
            permissions:
              contents: read
            runs-on: ubuntu-24.04
            steps:
                - name: Checkout
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                  with:
                    persist-credentials: false

                - name: Setup Python
                  uses: ./.github/actions/setup_python_env

                # The project venv pins dbt 2.0, so this job covers the legacy dbt-core
                # 1.x line instead. The task installs the newest 1.x release in an
                # isolated uvx environment, which leaves the venv untouched.
                - name: Regenerate dbt artifacts and run `dbt-bouncer`
                  run: |
                    (r=3;while ! mise run build-and-run-dbt-bouncer-dbt1 ; do ((--r))||exit;done)

        dbt-2:
            permissions:
              contents: read
            runs-on: ubuntu-24.04
            steps:
                - name: Checkout
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                  with:
                    persist-credentials: false

                - name: Setup Python
                  uses: ./.github/actions/setup_python_env

                # pyproject.toml pins dbt to the 2.0 series and uv.lock pins one patch
                # release. This probe deliberately has NO upper bound, so it installs the
                # newest dbt above 2.0.0 and reports drift before either pin moves. Log
                # the version, because a drift failure is easiest to trace from the
                # release it started on.
                # `uv pip install` targets the project venv. Do not use `uv run pip`:
                # uv does not put pip in the venv, so that form falls through to the
                # system interpreter and fails on a PEP 668 externally-managed install.
                - name: Install latest released dbt
                  run: |
                    uv pip install "dbt>2.0.0" -U
                    uv run dbt --version

                # Two probes, one engine. The `dbt` distribution on PyPI is the Fusion
                # engine, so a separate Fusion job would install exactly this package.
                # What differs is the code path, not the engine, so both run here:
                # `build` covers the warehouse path and all three artifacts, and `parse`
                # covers the database-free path that writes manifest.json alone.
                - name: Regenerate dbt artifacts and run `dbt-bouncer`
                  run: |
                    (r=3;while ! mise run build-and-run-dbt-bouncer ; do ((--r))||exit;done)

                - name: Parse the project and run `dbt-bouncer`
                  run: |
                    (r=3;while ! mise run build-and-run-dbt-bouncer-fusion ; do ((--r))||exit;done)
