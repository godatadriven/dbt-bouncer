---
    name: dbt artifacts probe

    on:
      schedule:
        - cron: '0 6 * * *'
      workflow_dispatch:

    env:
      DBT_PROFILES_DIR: dbt_project
      DBT_PROJECT_DIR: dbt_project

    jobs:
        dbt-cloud:
            permissions:
              contents: read
            runs-on: ubuntu-24.04
            steps:
                - name: Checkout
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                  with:
                    persist-credentials: false

                - name: Setup Python
                  uses: ./.github/actions/setup_python_env

                - name: Trigger dbt Cloud job and download artifacts
                  run: ./scripts/get_dbt_cloud_artifacts.sh
                  env:
                    DBT_ACCOUNT_ID: ${{ secrets.DBT_ACCOUNT_ID }}
                    DBT_CLOUD_JOB_ID: ${{ secrets.DBT_CLOUD_JOB_ID }}
                    DBT_TOKEN_VALUE: ${{ secrets.DBT_TOKEN_VALUE }}

                - name: Run `dbt-bouncer`
                  run: uv run dbt-bouncer --config-file ./dbt-bouncer-example.yml

        dbt-core:
            permissions:
              contents: read
            runs-on: ubuntu-24.04
            steps:
                - name: Checkout
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                  with:
                    persist-credentials: false

                - name: Setup Python
                  uses: ./.github/actions/setup_python_env

                # The project venv pins dbt 2.0, so this job covers the legacy dbt-core
                # 1.x line instead. The task installs the newest 1.x release in an
                # isolated uvx environment, which leaves the venv untouched.
                - name: Regenerate dbt artifacts and run `dbt-bouncer`
                  run: |
                    (r=3;while ! mise run build-and-run-dbt-bouncer-dbt1 ; do ((--r))||exit;done)

        dbt-2:
            permissions:
              contents: read
            runs-on: ubuntu-24.04
            steps:
                - name: Checkout
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                  with:
                    persist-credentials: false

                - name: Setup Python
                  uses: ./.github/actions/setup_python_env

                # uv.lock pins one dbt 2.0 patch release. This step upgrades the venv to
                # the newest release in the supported 2.0 series, so the probe catches
                # artifact drift before the lockfile moves. The bound matches the pin in
                # pyproject.toml; raise both together when adopting a new dbt minor.
                - name: Install latest released dbt 2.0.x
                  run: uv run pip install "dbt<2.1" -U

                - name: Regenerate dbt artifacts and run `dbt-bouncer`
                  run: |
                    (r=3;while ! mise run build-and-run-dbt-bouncer ; do ((--r))||exit;done)

        dbt-fusion:
            permissions:
              contents: read
            runs-on: ubuntu-24.04
            steps:
                - name: Checkout
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                  with:
                    persist-credentials: false

                - name: Setup Python
                  uses: ./.github/actions/setup_python_env

                # The `dbt` distribution on PyPI is the Fusion engine CLI, so pip gives
                # the same engine the native installer does, at a version this project
                # pins. Log the version, because a drift failure is easiest to trace
                # from the release it started on.
                - name: Install latest released dbt Fusion CLI
                  run: |
                    uv run pip install "dbt<2.1" -U
                    uv run dbt --version

                - name: Parse the project and run `dbt-bouncer`
                  run: |
                    (r=3;while ! mise run build-and-run-dbt-bouncer-fusion ; do ((--r))||exit;done)
