---
name: Pull Request AI Review

on:
  workflow_run:
    workflows: [CI pipeline]
    types: [completed]

jobs:
  ai_review:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    outputs:
      head_sha: ${{ steps.pr_outputs.outputs.head_sha }}
      pr_number: ${{ steps.pr_outputs.outputs.pr_number }}
      skip: ${{ steps.export.outputs.skip }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      # Check out only the composite action from the default branch so the
      # local `./_pr_resolver/...` action below is available (workflow_run runs
      # do not check out the repo by default).
      - name: Check out composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: _pr_resolver
          persist-credentials: false
          sparse-checkout: .github/actions

      - name: Export PR Event Data
        id: export
        uses: ./_pr_resolver/.github/actions/resolve-pr-from-workflow-run

      # Expose the resolved PR to the dependabot_auto_merge job.
      - name: Export PR outputs
        id: pr_outputs
        if: steps.export.outputs.skip != 'true'
        run: |-
          echo "head_sha=${PR_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Checkout PR Head
        if: steps.export.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Required to check out fork PR heads from this workflow_run job.
          # Accepted here because the job only reads the diff and runs a
          # constrained review (git diff/log/show, Read, Glob, Grep, Write to
          # /tmp) with no build/test execution of the fork's code, and the
          # token is scoped to contents:read + pull-requests:write.
          allow-unsafe-pr-checkout: true
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      # Build the review prompt once and store it in the environment. The
      # analyse step and its retry both read `REVIEW_PROMPT`, so there is one
      # copy of the prompt, not two. The runtime values (PR_CHANGED_FILES,
      # PR_BASE, PR_HEAD_SHA) are interpolated here, after the export step set
      # them.
      - name: Build review prompt
        id: build_prompt
        if: steps.export.outputs.skip != 'true'
        run: |-
          {
            echo "REVIEW_PROMPT<<REVIEW_PROMPT_DELIM"
            cat <<'REVIEW_PROMPT_BODY'
          You are a senior Python engineer reviewing a PR for dbt-bouncer, a tool that
          enforces conventions for dbt projects by running validation checks against dbt
          artifacts. This PR changes ${{ env.PR_CHANGED_FILES }} files.

          Analyse the full diff for this PR by running:
            git diff origin/${{ env.PR_BASE }}...${{ env.PR_HEAD_SHA }}

          For each file, determine what changed and WHY.

          ## Review Criteria
          Check for these issues and report them in the Review Findings section:
          1. **Python Quality**: Type hints on function signatures, clean imports, no dead code, proper use of Pydantic models and `Field()`.
          2. **Check Structure**: Proper use of `@check` decorator or `BaseCheck` subclass, correct `iterate_over_value` annotations, `fail()` or `DbtBouncerFailedCheckError` usage.
          3. **Test Coverage**: Parametrised tests with happy + unhappy paths, proper fixture usage, edge cases covered.
          4. **Security**: No hardcoded secrets, safe deserialization (no `yaml.unsafe_load`, no `pickle`), no command injection.
          5. **Style**: ruff/ruff-format compliance, snake_case naming, alphabetical ordering of lists and config sections. Ruff runs with `preview = true`: `# ruff: ignore[rule-name]` and `# ruff: file-ignore[rule-name]` are the correct suppression comments here, and ruff enforces them (RUF105 flags `# noqa`). Do not suggest replacing them with `# noqa`.
          6. **Breaking Changes**: Config schema changes, removed/renamed checks, changed function signatures.
          7. **Documentation**: Docstrings on public functions with Parameters/Returns sections, updated AGENTS.md if architecture changed.
          8. **Cross-file version consistency**: When a PR bumps a version-pinned tool (e.g. `bencherdev/bencher` in workflow files), grep the entire repo for the OLD version string to find other references (Dockerfiles, env vars, docs). Flag any stale occurrences as 🔴 **Issue**.
          9. **Skill version bumps**: If the PR changes any file under `skills/` (for example a `SKILL.md` or a `references/` file), confirm that the `version` field in `.claude-plugin/plugin.json` is bumped in the same PR. If it is not, flag as 🔴 **Issue**.

          ## Severity Levels
          Use these severity levels for review findings:
          - 🔴 **Issue** — bugs, security problems, missing tests on new checks, breaking changes without migration notes
          - 🟡 **Suggestion** — performance improvements, optional tests, documentation gaps, style nits
          - ✅ **All clear** — explicitly state when a category has no issues (proves it was checked)

          ## Adaptive Collapsibility
          If this PR changes 4 or more files, wrap the "File Changes" table in a `<details>` block:
          ```
          <details>
          <summary>📄 File Changes (N files)</summary>
          | File | Change | Description |
          ...
          </details>
          ```
          If fewer than 4 files, show the "File Changes" table expanded (no `<details>` wrapper).
          For the "Review Findings" section: NEVER collapse it if it contains any 🔴 or 🟡 items —
          those must always be immediately visible. Only wrap it in a `<details>` block if it
          contains no issues (only ✅ items).

          ## Output Format
          You MUST write your analysis to the file `/tmp/ai-pr-review-comment.md` using the Write tool.
          The file must start with the exact string `<!-- ai-pr-review-marker -->`.
          Write the complete markdown to this file — do not output it to the conversation.
          Use this template:
          <!-- ai-pr-review-marker -->
          ## 🔍 AI PR Review
          > **One-sentence TL;DR of the PR's purpose and business value.**

          **Type:** `feature` | `bugfix` | `refactor` | `docs` | `chore` | `test`

          ### Summary
          2-3 sentences explaining what changed and **why**. Focus on intent and business value,
          not implementation details. Explain how files relate to each other.

          ### File Changes
          | File | Change | Description |
          |------|--------|-------------|
          | `path/to/file` | New/Modified/Deleted | One-line description of what changed in this file |

          ### Review Findings
          - 🔴 **Issue:** file:line — description
          - 🟡 **Suggestion:** file:line — description
          - ✅ No issues with [category]
          (If no issues at all, write "✅ No issues found. Reviewed for Python quality, check structure, tests, security, style, breaking changes, and documentation.")
          ---
          *Generated by [Claude Code](https://github.com/anthropics/claude-code-action)*
          REVIEW_PROMPT_BODY
            echo "REVIEW_PROMPT_DELIM"
          } >> "$GITHUB_ENV"

      # The Anthropic API can return a transient 529 (overloaded). Run the
      # review, then retry once if the first attempt fails. Both attempts are
      # non-fatal (continue-on-error), so a sustained overload falls back to the
      # summary comment below instead of failing the whole workflow.
      - name: Analyse PR
        id: analyse
        if: steps.export.outputs.skip != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@2f6ae6dec5e61533cbcb273c336448960b2c6a06 # v1
        with:
          allowed_bots: "dependabot"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.PAT_GITHUB }}
          claude_args: >-
            --model claude-opus-4-6
            --allowedTools 'Bash(git diff*),Bash(git log*),Bash(git show*),Read,Glob,Grep,Write'
          prompt: ${{ env.REVIEW_PROMPT }}

      # Give a transient overload time to clear before the second attempt.
      - name: Wait before AI review retry
        if: steps.export.outputs.skip != 'true' && steps.analyse.outcome == 'failure'
        run: sleep 20

      - name: Analyse PR (retry)
        id: analyse_retry
        if: steps.export.outputs.skip != 'true' && steps.analyse.outcome == 'failure'
        continue-on-error: true
        uses: anthropics/claude-code-action@2f6ae6dec5e61533cbcb273c336448960b2c6a06 # v1
        with:
          allowed_bots: "dependabot"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.PAT_GITHUB }}
          claude_args: >-
            --model claude-opus-4-6
            --allowedTools 'Bash(git diff*),Bash(git log*),Bash(git show*),Read,Glob,Grep,Write'
          prompt: ${{ env.REVIEW_PROMPT }}

      - name: Post or update review comment
        if: always() && steps.export.outputs.skip != 'true'
        env:
          BASE_REF: ${{ env.PR_BASE }}
          # Post as github-actions[bot] instead of a personal account. In a
          # workflow_run event this is the privileged base-repo token, so it
          # works for fork PRs too.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ env.PR_HEAD_SHA }}
        run: |-
          COMMENT_FILE="/tmp/ai-pr-review-comment.md"

          # --- Generate fallback if Claude didn't write the file ---
          if [ ! -s "$COMMENT_FILE" ] || ! grep -q "ai-pr-review-marker" "$COMMENT_FILE"; then
            DIFF_STAT=$(git diff "origin/${BASE_REF}...${HEAD_SHA}" --stat | tail -1)
            {
              echo "<!-- ai-pr-review-marker -->"
              echo "## 🔍 AI PR Review"
              echo ""
              echo "> Auto-generated fallback — Claude analysis was not available."
              echo ""
              echo "**Type:** \`unknown\`"
              echo ""
              echo "### Summary"
              echo "This PR modifies the following files:"
              echo ""
              echo "### File Changes"
              echo "| File | Change | Description |"
              echo "|------|--------|-------------|"
              git diff "origin/${BASE_REF}...${HEAD_SHA}" --name-status | while IFS=$'\t' read -r status file; do
                case "$status" in
                  A) change="New" ;;
                  M) change="Modified" ;;
                  D) change="Deleted" ;;
                  R*) change="Renamed" ;;
                  *) change="$status" ;;
                esac
                echo "| \`${file}\` | ${change} | — |"
              done
              echo ""
              echo "**Diff stats:** ${DIFF_STAT}"
              echo ""
              echo "---"
              echo "*Generated by [Claude Code](https://github.com/anthropics/claude-code-action) (fallback)*"
            } > "$COMMENT_FILE"
          fi

          # --- Upsert: update existing comment or create new one ---
          MARKER="ai-pr-review-marker"
          COMMENT_IDS=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.body | contains(\"${MARKER}\")) | .id]")
          FIRST_ID=$(echo "$COMMENT_IDS" | jq -r 'first // empty')
          REST_IDS=$(echo "$COMMENT_IDS" | jq -r '.[1:] | .[]')
          if [ -n "$FIRST_ID" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${FIRST_ID}" \
              -f body="$(cat "$COMMENT_FILE")"
            for CID in $REST_IDS; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${CID}" || true
            done
          else
            gh pr comment "$PR_NUMBER" --body-file "$COMMENT_FILE"
          fi


  # Approve and enable auto-merge on Dependabot PRs whose AI review has no
  # 🔴/🟡 findings. GitHub then merges once every required check passes. This
  # lives here, not in its own workflow_run workflow, because a run chained off
  # this workflow reports main's SHA and cannot resolve the PR.
  dependabot_auto_merge:
    needs: ai_review
    # The workflow_run actor is whoever triggered CI, so a human push to a
    # Dependabot branch does not qualify.
    if: needs.ai_review.outputs.skip == 'false' && github.event.workflow_run.actor.login == 'dependabot[bot]'
    permissions:
      pull-requests: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      HEAD_SHA: ${{ needs.ai_review.outputs.head_sha }}
      PR_NUMBER: ${{ needs.ai_review.outputs.pr_number }}
    steps:
      - name: Check AI review findings
        id: findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          eligible() { echo "eligible=$1" >> "$GITHUB_OUTPUT"; }

          AUTHOR=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.user.login')
          if [ "$AUTHOR" != "dependabot[bot]" ]; then
            echo "::notice::PR #${PR_NUMBER} author is ${AUTHOR}, not dependabot[bot]. Skipping."
            eligible false
            exit 0
          fi

          # Only trust the comment posted by this workflow (github-actions[bot]).
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("ai-pr-review-marker"))) | .body' \
            > /tmp/ai-review.md

          if [ ! -s /tmp/ai-review.md ]; then
            echo "::notice::No AI review comment found. Skipping."
            eligible false
          elif grep -q "Claude analysis was not available" /tmp/ai-review.md; then
            echo "::notice::AI review fell back to a file list. Skipping."
            eligible false
          elif grep -qE "🔴|🟡" /tmp/ai-review.md; then
            echo "::notice::AI review has 🔴 or 🟡 findings. Skipping."
            eligible false
          else
            eligible true
          fi

      # PAT_GITHUB belongs to the code owner, so its approval satisfies the
      # code-owner review rule (a github-actions[bot] approval does not). A merge
      # made with GITHUB_TOKEN also would not trigger the push-to-main workflows.
      - name: Approve and enable auto-merge
        if: steps.findings.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB }}
        run: |-
          gh pr review "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --approve \
            --body "Auto-approved: CI passed and the AI review has no 🔴 or 🟡 findings."
          # --match-head-commit stops the merge if Dependabot pushes again.
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash \
            --match-head-commit "$HEAD_SHA"
