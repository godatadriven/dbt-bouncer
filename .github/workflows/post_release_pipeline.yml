---
name: Post release pipeline

on:
    release:
        types: [published]

env:
    DBT_PROFILES_DIR: dbt_project
    DBT_PROJECT_DIR: dbt_project

jobs:
    # Gate so the matrix does not start before the release exists at all. Each
    # downstream job still retries its own install: PyPI's CDN edges propagate
    # independently, so a pass on this runner says nothing about other runners.
    pypi-pause:
        runs-on: ubuntu-26.04
        steps:
            - name: Wait for PyPI package availability
              run: |
                VERSION="${GITHUB_REF_NAME#v}"
                echo "Waiting for dbt-bouncer==$VERSION on PyPI..."
                TIMEOUT=600
                INTERVAL=30
                ELAPSED=0
                while [ $ELAPSED -lt $TIMEOUT ]; do
                  # Poll the simple index (what pip/uv read), not the JSON API, which updates first.
                  if curl -sf -A "dbt-bouncer-release-pipeline" -H "Cache-Control: no-cache" "https://pypi.org/simple/dbt-bouncer/" | grep -q "dbt_bouncer-${VERSION}-"; then
                    echo "Package dbt-bouncer==$VERSION is available on PyPI."
                    exit 0
                  fi
                  echo "Not yet available, retrying in ${INTERVAL}s... (${ELAPSED}s elapsed)"
                  sleep $INTERVAL
                  ELAPSED=$((ELAPSED + INTERVAL))
                done
                echo "Timed out waiting for dbt-bouncer==$VERSION on PyPI after ${TIMEOUT}s."
                exit 1

    docker-tests:
        needs: [pypi-pause]
        permissions:
          contents: read
        runs-on: ubuntu-26.04
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                persist-credentials: false

            # dbt-bouncer is installed in the image at build time, so this needs no PyPI access.
            - name: Check that the image holds the released version
              run: |
                set -euo pipefail
                image_version="$(docker run --rm --network none "ghcr.io/godatadriven/dbt-bouncer:${GITHUB_REF_NAME}" --version)"
                echo "Image version: ${image_version}"
                [ "${image_version}" = "${GITHUB_REF_NAME#v}" ]

            - name: Run Docker test
              run: |
                docker run --rm \
                  --volume "$PWD":/app \
                  "ghcr.io/godatadriven/dbt-bouncer:${GITHUB_REF_NAME}" \
                  --config-file /app/dbt-bouncer-example.yml

    github-action-test:
        needs: [pypi-pause]
        permissions:
          contents: read
        runs-on: ubuntu-26.04
        steps:
            - name: Checkout
              run: git clone https://github.com/godatadriven/dbt-bouncer.git --branch "${GITHUB_REF_NAME}" --depth 1

            - name: Run `dbt-bouncer`
              uses: ./dbt-bouncer
              with:
                config-file: ./dbt-bouncer/dbt-bouncer-example.yml
                send-pr-comment: false

    pypi-tests:
        needs: [pypi-pause]
        permissions:
          contents: read
        runs-on: ${{ matrix.operating-system }}
        strategy:
            fail-fast: false
            matrix:
                operating-system:
                  - ubuntu-26.04
                  - windows-2025
                python-version:
                    - '3.11'
                    - '3.12'
                    - '3.13'
                    - '3.14'
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                persist-credentials: false

            - name: Setup Python
              uses: ./.github/actions/setup_python_env
              with:
                python-version: ${{ matrix.python-version }}

            # Retry because each runner can hit a PyPI CDN edge that still serves the old index.
            # `--no-cache-dir` matters: pip caches the simple index page, so a retry would otherwise re-read the stale copy.
            - name: Install `dbt-bouncer`
              shell: bash
              run: |
                for attempt in $(seq 1 10); do
                  if pip install --no-cache-dir "dbt-bouncer==${GITHUB_REF_NAME#v}"; then
                    exit 0
                  fi
                  echo "Attempt ${attempt}/10 failed, retrying in 30s..."
                  sleep 30
                done
                exit 1

            - name: Run `dbt-bouncer`
              run: dbt-bouncer run --config-file dbt-bouncer-example.yml

            - name: Regenerate dbt artifacts and run `dbt-bouncer`
              if: matrix.operating-system == 'windows-2025'
              run: |
                $env:Path += ';C:\Users\runneradmin\.local\bin'
                mise run build-and-run-dbt-bouncer

            - name: Regenerate dbt artifacts and run `dbt-bouncer`
              if: matrix.operating-system != 'windows-2025'
              run: |
                (r=3;while ! mise run build-and-run-dbt-bouncer ; do ((--r))||exit;done)
