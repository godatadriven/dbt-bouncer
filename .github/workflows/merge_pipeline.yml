---
  name: Merge pipeline

  on:
    push:
      branches:
        - main
    workflow_dispatch:

  env:
    DBT_PROFILES_DIR: dbt_project
    DBT_PROJECT_DIR: dbt_project

  jobs:
      benchmark-main-branch:
        permissions:
          checks: write
          contents: read
        runs-on: ubuntu-26.04
        steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            with:
              persist-credentials: false

          - name: Setup Python
            uses: ./.github/actions/setup_python_env

          - name: Install `dbt-bouncer`
            run: pip install git+https://github.com/godatadriven/dbt-bouncer.git@${{ github.sha }}

          - name: Install bencher
            uses: bencherdev/bencher@f80847436d7157936b40525db4c2a1064124f04a # v0.6.13

          - name: Install Hyperfine
            uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
            with:
              tool: hyperfine@1.20

          - name: Track base branch benchmarks with Bencher
            run: |
              bencher run \
                --project dbt-bouncer \
                --token '${{ secrets.BENCHER_API_TOKEN }}' \
                --branch main \
                --testbed ubuntu-26.04 \
                --threshold-measure latency \
                --threshold-test t_test \
                --threshold-max-sample-size 64 \
                --threshold-upper-boundary 0.999 \
                --thresholds-reset \
                --err \
                --adapter shell_hyperfine \
                --format json \
                --github-actions '${{ secrets.GITHUB_TOKEN }}' \
                --file results.json \
                "hyperfine --export-json results.json --runs 10 'dbt-bouncer run --config-file dbt-bouncer-example.yml'"

      benchmark-micro-main-branch:
        permissions:
          checks: write
          contents: read
        runs-on: ubuntu-26.04
        steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            with:
              persist-credentials: false

          - name: Setup Python
            uses: ./.github/actions/setup_python_env

          - name: Install bencher
            uses: bencherdev/bencher@f80847436d7157936b40525db4c2a1064124f04a # v0.6.13

          - name: Run code-level benchmarks
            run: mise run test-benchmark

          - name: Track base branch code-level benchmarks with Bencher
            run: |
              bencher run \
                --project dbt-bouncer \
                --token '${{ secrets.BENCHER_API_TOKEN }}' \
                --branch main \
                --testbed ubuntu-26.04-pytest \
                --threshold-measure latency \
                --threshold-test t_test \
                --threshold-max-sample-size 64 \
                --threshold-upper-boundary 0.999 \
                --thresholds-reset \
                --err \
                --adapter python_pytest \
                --average median \
                --format json \
                --github-actions '${{ secrets.GITHUB_TOKEN }}' \
                --file pytest_benchmark_results.json

      coverage-badge:
          permissions:
            contents: write
          # Serialise concurrent main pushes to avoid racing pushes to the badges branch.
          concurrency:
            group: coverage-badge
            cancel-in-progress: true
          runs-on: ubuntu-26.04
          steps:
              - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                with:
                  # Required for `git push` to the badges branch below.
                  persist-credentials: true

              - name: Setup Python
                uses: ./.github/actions/setup_python_env

              - name: Run tests with coverage
                run: mise run test

              - name: Generate coverage badge
                run: |
                  uv run --with genbadge[coverage] genbadge coverage \
                    --input-file coverage.xml \
                    --output-file coverage.svg

              - name: Publish badge to badges branch
                run: |
                  set -euo pipefail
                  cp coverage.svg /tmp/coverage.svg
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git config user.name "github-actions[bot]"
                  if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
                      git fetch origin badges:badges
                      git worktree add /tmp/badges badges
                  else
                      git worktree add --orphan -b badges /tmp/badges
                  fi
                  cp /tmp/coverage.svg /tmp/badges/coverage.svg
                  cd /tmp/badges
                  git add coverage.svg
                  if git diff --cached --quiet; then
                      echo "Badge unchanged, skipping push."
                  else
                      git commit -m "ci: update coverage badge"
                      git push origin badges
                  fi

              # PR coverage comments measure unit tests only, so store main's
              # unit-only coverage as their baseline.
              - name: Run unit tests with coverage
                run: mise run test-unit

              # Keep this step last: the action runs as root in Docker and
              # re-checks out the workspace, leaving root-owned files behind.
              - name: Store coverage data for PR comments
                uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
                with:
                  ACTIVITY: save_coverage_data_files
                  GITHUB_TOKEN: ${{ github.token }}
                  MINIMUM_GREEN: 100
                  MINIMUM_ORANGE: 95

      deploy-docs:
          # Serialise gh-pages pushes so concurrent merges do not race.
          concurrency:
            group: deploy-docs-gh-pages
            cancel-in-progress: false
          permissions:
            contents: write
          runs-on: ubuntu-26.04
          steps:
              - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

              - name: Fetch tags
                run: git fetch --prune --unshallow --tags

              - name: Setup Python
                uses: ./.github/actions/setup_python_env

              - name: Deploy docs website
                run: |
                  git config --global user.email "bot@github.com"
                  git config --global user.name "github-actions[bot]"
                  uv run mike deploy --push --update-aliases latest

      docker-tests:
        permissions:
          contents: read
        runs-on: ubuntu-26.04
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                persist-credentials: false

            - name: Setup Python
              id: setup-python
              uses: ./.github/actions/setup_python_env

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4


            - name: Build image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  build-args: PYTHON_VERSION=${{ steps.setup-python.outputs.python-version }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  context: .
                  load: true
                  push: false
                  tags: dbt-bouncer:test

            - name: Run e2e test
              run: |
                docker run --rm \
                  --volume "$PWD":/app \
                  dbt-bouncer:test \
                  --config-file /app/dbt-bouncer-example.yml

      pip-tests:
        permissions:
          contents: read
        runs-on: ${{ matrix.operating-system }}
        strategy:
            fail-fast: false
            matrix:
                operating-system:
                  - ubuntu-26.04
                  - windows-2025
                python-version:
                    - '3.11'
                    - '3.12'
                    - '3.13'
                    - '3.14'
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                persist-credentials: false

            - name: Setup Python
              uses: ./.github/actions/setup_python_env
              with:
                python-version: ${{ matrix.python-version }}

            - name: Install `dbt-bouncer`
              run: pip install git+https://github.com/godatadriven/dbt-bouncer.git@${{ github.sha }}

            - name: Run `dbt-bouncer`
              run: dbt-bouncer run --config-file dbt-bouncer-example.yml

            - name: Regenerate dbt artifacts and run `dbt-bouncer`
              if: matrix.operating-system == 'windows-2025'
              run: |
                $env:Path += ';C:\Users\runneradmin\.local\bin'
                mise run build-and-run-dbt-bouncer

            - name: Regenerate dbt artifacts and run `dbt-bouncer`
              if: matrix.operating-system != 'windows-2025'
              run: |
                (r=3;while ! mise run build-and-run-dbt-bouncer ; do ((--r))||exit;done)
