---
name: CI pipeline

on:
  pull_request:
      branches:
          - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DBT_PROFILES_DIR: dbt_project
  DBT_PROJECT_DIR: dbt_project
  IMAGE_NAME: ${{ github.repository }}
  REGISTRY: ghcr.io
  UV_SYSTEM_PYTHON: 1

jobs:
    prek:
        permissions:
          contents: read
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                fetch-depth: "0"
                persist-credentials: false

            - name: checkout-merge
              uses: check-spelling/checkout-merge@c9cfe4b33a6ceb6c13136887a6fd3a3ed6443f28 # v0.0.8

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                node-version: "22"

            - name: Setup Python
              uses: ./.github/actions/setup_python_env

            - name: Validate pre-commit hooks manifest
              run: uv run prek validate-manifest

            - name: Run prek
              run: |
                git diff --name-status origin/main..HEAD > changed_files.txt
                cat changed_files.txt
                cat changed_files.txt | xargs uv run prek run --show-diff-on-failure --files

    schema-check:
        needs: [prek]
        permissions:
          contents: read
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                persist-credentials: false

            - name: checkout-merge
              uses: check-spelling/checkout-merge@c9cfe4b33a6ceb6c13136887a6fd3a3ed6443f28 # v0.0.8

            - name: Setup Python
              uses: ./.github/actions/setup_python_env

            - name: Verify schema.json is up to date
              run: |
                uv run python scripts/generate_schema.py
                git diff --exit-code schema.json || {
                  echo "::error::schema.json is out of date. Run 'mise run generate-schema' and commit the result."
                  exit 1
                }

    unit-tests:
        needs: [prek]
        runs-on: ${{ matrix.operating-system }}
        # permissions:
        #     checks: write
        #     contents: write
        #     id-token: write
        #     issues: write
        #     pull-requests: write
        strategy:
            fail-fast: false
            matrix:
                operating-system:
                  - ubuntu-24.04
                  - windows-2025
                python-version:
                    - '3.11'
                    - '3.12'
                    - '3.13'
                    - '3.14'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                persist-credentials: false

            - name: checkout-merge
              if: matrix.operating-system != 'windows-2025'
              uses: check-spelling/checkout-merge@c9cfe4b33a6ceb6c13136887a6fd3a3ed6443f28 # v0.0.8

            - name: Setup Python
              uses: ./.github/actions/setup_python_env
              with:
                python-version: ${{ matrix.python-version }}

            - name: Run pytest (Windows)
              if: matrix.operating-system == 'windows-2025'
              run: mise run test-windows

            - name: Run pytest (unit tests)
              if: matrix.operating-system != 'windows-2025'
              run: mise run test-unit

            - name: Run pytest (integration tests)
              if: matrix.operating-system != 'windows-2025'
              run: mise run test-integration

            - name: Regenerate dbt artifacts and run `dbt-bouncer`
              if: matrix.operating-system == 'windows-2025'
              run: |
                $env:Path += ';C:\Users\runneradmin\.local\bin'
                mise run build-and-run-dbt-bouncer

            - name: Regenerate dbt artifacts and run `dbt-bouncer`
              if: matrix.operating-system != 'windows-2025'
              run: |
                  (r=3;while ! mise run build-and-run-dbt-bouncer ; do ((--r))||exit;done)

    benchmark-pr-branch:
        needs: [prek]
        permissions:
          contents: read
        runs-on: ubuntu-24.04
        steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            with:
              persist-credentials: false

          - name: Setup Python
            uses: ./.github/actions/setup_python_env

          - name: Install `dbt-bouncer`
            run: mise run install

          - name: Install Hyperfine
            uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
            with:
              tool: hyperfine@1.20

          - name: Run benchmarks
            run: |
              hyperfine --export-json benchmark_results.json --runs 10 'uv run dbt-bouncer --config-file dbt-bouncer-example.yml'

          - name: Upload Benchmark Results
            uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
            with:
              name: benchmark_results.json
              path: ./benchmark_results.json

    benchmark-micro-pr-branch:
        needs: [prek]
        permissions:
          contents: read
        runs-on: ubuntu-24.04
        steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            with:
              persist-credentials: false

          - name: Setup Python
            uses: ./.github/actions/setup_python_env

          - name: Run code-level benchmarks
            run: mise run test-benchmark

          - name: Upload Benchmark Results
            uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
            with:
              name: pytest_benchmark_results.json
              path: ./pytest_benchmark_results.json

    dev-container:
      needs: [prek]
      permissions:
        contents: read
      runs-on: ubuntu-24.04
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
          with:
            persist-credentials: false

        - name: Build container and run tests
          uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
          with:
            # mise resolves `ubi:` tools via the GitHub API. Unauthenticated
            # runners share an IP-based limit of 60 requests/hour, so without a
            # token this job fails intermittently on rate limits rather than on
            # anything in the change under test.
            env: |
              GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
            runCmd: |
              set -eou
              uv run dbt-bouncer --config-file dbt-bouncer-example.yml
              mise run test-dev-container
              mise run test-perf

    e2e-tests:
        needs: [prek]
        permissions:
          contents: read
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                persist-credentials: false

            - name: checkout-merge
              uses: check-spelling/checkout-merge@c9cfe4b33a6ceb6c13136887a6fd3a3ed6443f28 # v0.0.8

            - name: Setup Python
              id: setup-python
              uses: ./.github/actions/setup_python_env

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

            - name: Modify Dockerfile to use local dbt-bouncer version
              run: |
                set -eou
                sed -i -E 's/ENTRYPOINT \["uvx", "dbt-bouncer==0.0.0"\]/ENTRYPOINT \["uvx", "."\]/' Dockerfile
                sed -i -E '/ENTRYPOINT/i\COPY . .' ./Dockerfile

            - name: Build image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  build-args: PYTHON_VERSION=${{ steps.setup-python.outputs.python-version }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  context: .
                  load: true
                  push: false
                  tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci

            - name: Run e2e test
              run: |
                docker run --rm \
                  --volume "$PWD":/app \
                  "${REGISTRY}/${IMAGE_NAME}:ci" \
                  --config-file /app/dbt-bouncer-example.yml

    # Exercises `action.yml` itself, rather than the CLI it wraps. The e2e job
    # above calls `docker run` directly, so it never evaluates the composite
    # action's parameter assembly steps or its `${{ }}` wiring. Every case here
    # asserts observable behaviour, so an input that never reaches the CLI fails
    # the job instead of passing silently.
    action-tests:
        needs: [prek]
        permissions:
          contents: read
        runs-on: ubuntu-24.04
        env:
            # Must match the image tag hardcoded in `action.yml`. It is spelled out
            # rather than built from `github.repository` so that a fork run builds
            # the tag the action actually pulls.
            ACTION_IMAGE: ghcr.io/godatadriven/dbt-bouncer:v0.0.0
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                persist-credentials: false

            - name: checkout-merge
              uses: check-spelling/checkout-merge@c9cfe4b33a6ceb6c13136887a6fd3a3ed6443f28 # v0.0.8

            - name: Setup Python
              id: setup-python
              uses: ./.github/actions/setup_python_env

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

            - name: Modify Dockerfile to use local dbt-bouncer version
              run: |
                set -eou
                sed -i -E 's/ENTRYPOINT \["uvx", "dbt-bouncer==0.0.0"\]/ENTRYPOINT \["uvx", "."\]/' Dockerfile
                sed -i -E '/ENTRYPOINT/i\COPY . .' ./Dockerfile

            - name: Build image under the tag the action pulls
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  build-args: PYTHON_VERSION=${{ steps.setup-python.outputs.python-version }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  context: .
                  load: true
                  push: false
                  tags: ${{ env.ACTION_IMAGE }}

            # Case A: the pre-existing inputs still behave as they did, with none
            # of the new inputs set. Guards against a regression for workflows
            # that are not updated.
            - name: "A: config-file only"
              uses: ./
              with:
                config-file: dbt-bouncer-example.yml
                send-pr-comment: false

            # Case B: `--preset` is ignored whenever an explicit `--config-file`
            # is passed, so the action must omit `--config-file` when `preset` is
            # set. If it does not, dbt-bouncer looks for the non-existent
            # /app/dbt-bouncer.yml and exits 2, failing this step.
            - name: "B: preset replaces config-file"
              uses: ./
              with:
                output-file: preset-results.json
                output-format: json
                preset: minimal
                send-pr-comment: false

            # Exit code 0 alone could be luck, so confirm the results came from
            # the preset. The minimal preset runs source checks; the pyproject.toml
            # fallback config does not.
            - name: "B: assert the results came from the preset"
              run: |
                set -euo pipefail
                jq -e '[.[] | .check_run_id | split(":")[0]]
                       | index("check_source_freshness_populated")' preset-results.json

            # Case C: the strict preset fails this project, so exit 0 here proves
            # --dry-run reached the CLI. A dropped flag would exit 1.
            - name: "C: dry-run short-circuits a failing preset"
              uses: ./
              with:
                dry-run: true
                preset: strict
                send-pr-comment: false

            # Control for case C: without --dry-run the same preset must fail.
            # Without this, case C would pass even if strict stopped failing.
            - name: "C: control — strict preset fails without dry-run"
              id: strict-control
              continue-on-error: true
              uses: ./
              with:
                preset: strict
                send-pr-comment: false

            - name: "C: assert the control failed"
              env:
                OUTCOME: ${{ steps.strict-control.outcome }}
              run: |
                set -euo pipefail
                test "$OUTCOME" = "failure"

            # Case D: comparing the artifacts against themselves means every
            # failure is present in the base run, so all are suppressed. Exit 0
            # proves --state reached the CLI; the control above shows the same
            # preset fails without it.
            - name: "D: state suppresses pre-existing failures"
              uses: ./
              with:
                preset: strict
                send-pr-comment: false
                state: dbt_project/target

            # Case E: a baseline round trip. The action only ever runs `run`, so
            # the config and the baseline are produced by direct docker calls
            # first. `-w /app` is required because the image sets no WORKDIR.
            # `-w /app` and DBT_PROJECT_DIR mirror what the action itself passes,
            # so the baseline is recorded against the same artifacts the action
            # will check. The image sets no WORKDIR, so without `-w` the CWD is /.
            - name: "E: build a failing config and its baseline"
              run: |
                set -euo pipefail
                docker run --rm -w /app --env DBT_PROJECT_DIR --volume "$PWD":/app \
                  "$ACTION_IMAGE" init --preset strict
                docker run --rm -w /app --env DBT_PROJECT_DIR --volume "$PWD":/app \
                  "$ACTION_IMAGE" baseline \
                    --config-file /app/dbt-bouncer.yml \
                    --output-file /app/baseline.json
                test -s baseline.json

            - name: "E: control — the config fails without a baseline"
              id: baseline-control
              continue-on-error: true
              uses: ./
              with:
                config-file: dbt-bouncer.yml
                send-pr-comment: false

            - name: "E: baseline suppresses those same failures"
              uses: ./
              with:
                baseline: baseline.json
                config-file: dbt-bouncer.yml
                send-pr-comment: false

            - name: "E: assert the control failed"
              env:
                OUTCOME: ${{ steps.baseline-control.outcome }}
              run: |
                set -euo pipefail
                test "$OUTCOME" = "failure"

    docs-build:
      needs: [prek]
      permissions:
        contents: read
      runs-on: ubuntu-24.04
      steps:
          - name: Checkout
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            with:
              persist-credentials: false

          - name: checkout-merge
            uses: check-spelling/checkout-merge@c9cfe4b33a6ceb6c13136887a6fd3a3ed6443f28 # v0.0.8

          - name: Setup Python
            uses: ./.github/actions/setup_python_env

          - name: Build docs website
            run: uv run zensical build
