name: 'dbt-bouncer'
description: 'Configure and enforce conventions for your dbt project.'
inputs:
  baseline:
    default: ''
    description: >-
      Path to a baseline file, relative to the repository root. Failures listed in it are suppressed, so only new failures are reported.
    required: false
  check:
    default: ''
    description: >-
      Limit the checks run to specific check names, comma-separated. Examples: 'check_model_has_unique_test', 'check_model_names,check_source_freshness_populated'.
    required: false
  config-file:
    default: 'dbt-bouncer.yml'
    description: 'Location of the YML config file. Ignored when `preset` is set.'
    required: false
  dry-run:
    default: 'false'
    description: 'Print which checks would run (name, resource type, count) without executing them.'
    required: false
  only:
    default: ''
    description: >-
      Limit the checks run to specific categories, comma-separated. Examples: 'manifest_checks', 'catalog_checks,manifest_checks'.
    required: false
  output-file:
    default: ''
    description: 'Name of the file where check metadata will be saved.'
    required: false
  output-format:
    default: 'json'
    description: 'Format for the output file (requires output-file). One of: csv, json, junit, sarif, tap. Defaults to json.'
    required: false
  output-only-failures:
    default: 'false'
    description: If passed then only failures will be included in the output file.
    required: false
  preset:
    default: ''
    description: >-
      Run a bundled preset config instead of a config file. One of: minimal, standard, strict. When set, `config-file` is not passed. A preset resolves artifact paths relative to the repository root, so set the DBT_PROJECT_DIR environment variable if your dbt project is not at the root.
    required: false
  send-pr-comment:
    default: 'true'
    description: |
      true: Send a comment to the GitHub PR with a list of failed checks.
      false: Do not send a comment.
    required: false
  show-all-failures:
    default: 'false'
    description: Print all failures to the console.
    required: false
  state:
    default: ''
    description: >-
      Directory of dbt artifacts from a previous run, relative to the repository root. Failures present in that base run are suppressed, so only new failures are reported.
    required: false
  verbose:
    default: 'false'
    description: Run dbt-bouncer in verbose mode.
    required: false

runs:
  using: composite

  steps:
    # Inputs are read through `env:` and assembled into a bash array, never
    # interpolated into the script body. A composite action's inputs come from
    # the caller's `with:` block, and a caller may pass untrusted data through
    # it -- a PR title, a branch name, an issue body. `${{ }}` substitution
    # happens before the shell runs, so such a value would be substituted as
    # code rather than data.
    #
    # The array matters as much as `env:`. The previous version assembled flag
    # strings into step outputs, then interpolated those outputs unquoted so
    # they would word-split into arguments. That re-opened the same hole one
    # step later: a value reaching `check` was substituted into the docker
    # command verbatim. Expanding "${args[@]}" keeps every element a single
    # argument, whatever it contains.
    # See https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections
    - name: Run dbt-bouncer
      id: run-dbt-bouncer
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_CHECK: ${{ inputs.check }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_ONLY: ${{ inputs.only }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_OUTPUT_FORMAT: ${{ inputs.output-format }}
        INPUT_OUTPUT_ONLY_FAILURES: ${{ inputs.output-only-failures }}
        INPUT_PRESET: ${{ inputs.preset }}
        INPUT_SEND_PR_COMMENT: ${{ inputs.send-pr-comment }}
        INPUT_SHOW_ALL_FAILURES: ${{ inputs.show-all-failures }}
        INPUT_STATE: ${{ inputs.state }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
      run: |
        set -euo pipefail

        args=(run)

        # `--preset` is ignored whenever an explicit `--config-file` is passed,
        # so the two are mutually exclusive: a preset replaces the config file.
        if [[ -z "$INPUT_PRESET" ]]; then
          args+=(--config-file "/app/$INPUT_CONFIG_FILE")
        else
          args+=(--preset "$INPUT_PRESET")
        fi

        if [[ "$INPUT_SEND_PR_COMMENT" = "true" ]]; then
          args+=(--create-pr-comment-file)
        else
          args+=(--no-create-pr-comment-file)
        fi

        [[ -n "$INPUT_BASELINE" ]] && args+=(--baseline "/app/$INPUT_BASELINE")
        [[ -n "$INPUT_CHECK" ]] && args+=(--check "$INPUT_CHECK")
        [[ "$INPUT_DRY_RUN" != "false" ]] && args+=(--dry-run)
        [[ -n "$INPUT_ONLY" ]] && args+=(--only "$INPUT_ONLY")
        [[ -n "$INPUT_OUTPUT_FILE" ]] && args+=(--output-file "/app/$INPUT_OUTPUT_FILE")
        [[ "$INPUT_OUTPUT_FORMAT" != "json" ]] && args+=(--output-format "$INPUT_OUTPUT_FORMAT")
        [[ "$INPUT_OUTPUT_ONLY_FAILURES" != "false" ]] && args+=(--output-only-failures)
        [[ "$INPUT_SHOW_ALL_FAILURES" != "false" ]] && args+=(--show-all-failures)
        [[ -n "$INPUT_STATE" ]] && args+=(--state "/app/$INPUT_STATE")
        [[ "$INPUT_VERBOSE" != "false" ]] && args+=(-v)

        # GITHUB_REF, GITHUB_REPOSITORY and GITHUB_RUN_ID are set by the runner
        # already, so they pass through by name. GITHUB_TOKEN comes from `env:`.
        docker run --rm \
          --env CREATE_DBT_BOUNCER_CONFIG_FILE=false \
          --env DBT_PROJECT_DIR \
          --env GITHUB_REF \
          --env GITHUB_REPOSITORY \
          --env GITHUB_RUN_ID \
          --env GITHUB_TOKEN \
          --volume "$GITHUB_WORKSPACE":/app \
          --workdir /app \
          ghcr.io/godatadriven/dbt-bouncer:v0.0.0 \
          "${args[@]}"

    - name: Send PR comment
      if: always() && inputs.send-pr-comment == 'true' && steps.run-dbt-bouncer.outcome != 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        gh pr comment "$PR_NUMBER" \
          --repo "$REPO" \
          --body-file github-comment.md
