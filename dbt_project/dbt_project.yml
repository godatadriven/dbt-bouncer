name: 'dbt_bouncer_test_project'
version: '1.0.0'
config-version: 2

profile: 'dbt_bouncer'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets:
  - "target"
  - "dbt_packages"


tests:
  dbt_bouncer_test_project:
    marts:
      +tags:
        - critical

models:
  dbt_bouncer_test_project:
    intermediate:
      +access: protected
      +schema: intermediate
    marts:
      +access: public
      +materialized: table
      +schema: marts
    staging:
      +access: protected
      crm:
        +schema: stg_crm
        +tags:
          - crm
      payments:
        +schema: stg_payments
  internal_package:
    +materialized: table
# Create a real relation for the `dummy_source.customers` source so it appears
# in catalog.json and the catalog source checks get real coverage. `id` is cast
# to BIGINT to match the `customers` model contract. See GitHub issue #1064.
on-run-start:
  - >
    CREATE OR REPLACE TABLE main.customers AS
    SELECT CAST(id AS BIGINT) AS id,
           CAST(first_name AS VARCHAR) AS first_name,
           CAST(last_name AS VARCHAR) AS last_name
    FROM read_csv_auto('./dbt_project/seeds/raw_customers.csv')
flags:
  require_generic_test_arguments_property: true
  # Promote every dbt warning to an error, so a new warning in this fixture project
  # fails the build instead of accumulating unnoticed. dbt 2.0 has no `--warn-error`
  # flag, so this project-level setting is the only way to express it.
  # InvalidConfig is silenced because dbt 2.0 raises it when it cannot validate the
  # semantic manifest without dbt platform credentials. That is environmental, and
  # this project has no credentials by design.
  # The dbt 1.x tasks in mise.toml reset this with `--warn-error-options`. dbt 1.x
  # emits two warnings that dbt 2.0 does not, and neither is a defect here: a known
  # false positive on custom generic tests (dbt-core issue #11792) and dbt-duckdb
  # rejecting the `grants` config, which exists to give dbt-bouncer a grants fixture.
  warn_error_options:
    error: all
    silence:
      - InvalidConfig
vars:
  fivetran__remove_empty_table_warnings: true
