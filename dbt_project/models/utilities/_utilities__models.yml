version: 2

models:
  - name: py_order_stats
    description: Python model example for testing Python model support in dbt-bouncer.
    config:
      # dbt 2.0 (Fusion) does not support Python models on duckdb.
      # This MUST use the inline dbt_version built-in, not dbt_version_at_least():
      # project macros are not in scope when dbt 1.x evaluates `enabled:` at parse
      # time, so the macro form fails on dbt 1.12 with
      # "Compilation Error: 'dbt_version_at_least' is undefined". dbt 2.0 accepts
      # the macro, but both versions must parse this file.
      enabled: "{{ (dbt_version.split('.')[0] | int) < 2 }}"
      meta:
        maturity: gold
    columns:
      - name: order_id
        description: Primary key for orders.
        tests:
          - unique
          - not_null
      - name: customer_id
        description: This is a unique identifier for a customer
      - name: order_date
        description: Date (UTC) that the order was placed
      - name: status
        description: '{{ doc("orders_status") }}'
