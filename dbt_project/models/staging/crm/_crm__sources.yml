version: 2

sources:
  - name: dummy_source
    # Use the `main` schema so this source aliases the `main.customers` table
    # that the `on-run-start` hook in dbt_project.yml creates. That hook builds
    # a real relation during `dbt build`, so this source lands in catalog.json
    # (unlike an `external_location` source, which never becomes a physical
    # relation). This gives catalog source checks real coverage. See GitHub
    # issue #1064.
    schema: main
    config:
      freshness:
        warn_after: {count: 12, period: hour}
        error_after: {count: 24, period: hour}
      loaded_at_field: doesnt_exist
    description: This is a dummy source that is used for testing. It has no real data, but it is useful for testing dbt's source freshness and other features.
    loader: python_script

    tables:
      - name: customers
        description: This is actually a seed but we are abusing it so we have a realistic source we can use for development.
        config:
          meta:
            contact:
              email: chris@email.com
              slack: |
                @chrissy
            owner: Chris
            labels:
              team: finance
          tags:
            - example_tag
        columns:
          - name: id
            tests:
              - not_null
          - name: first_name
          - name: last_name
