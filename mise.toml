# mise configuration — single source of truth for tool versions, env vars, and
# developer tasks. Replaces the old `makefile`.
#
#   mise install            # provision the pinned tools below
#   mise run install        # install Python dependencies (uv)
#   mise tasks              # list available tasks
#   mise run <task>         # run a task (e.g. `mise run test-unit`)
#
# `uv` remains the Python package manager; mise pins/installs the tools (uv
# included) and runs the tasks.

[tools]
# Python is intentionally NOT managed by mise. `uv` reads `.python-version`
# natively for the project venv, and CI's setup-python provides the matrix
# interpreter. If mise also managed python it would install its own copy and
# put `python`/`pip` shims ahead of the CI interpreter on PATH, breaking plain
# `pip install` smoke tests (the console script lands off-PATH) and forcing a
# single pinned python across the whole test matrix.
uv = "latest"
node = "22"
hyperfine = "1.20"
# bencher is not in the mise registry; the ubi backend pulls the GitHub release.
"ubi:bencherdev/bencher" = "0.6.11"

[env]
DBT_PROFILES_DIR = "./dbt_project"
DBT_PROJECT_DIR = "./dbt_project"

# --- Environment -------------------------------------------------------------

[tasks.install]
description = "Install dependencies"
run = "uv sync --extra=dev --group=docs"

# --- Artifacts / schema ------------------------------------------------------

# On GitHub the `dbt build` command often returns "leaked semaphores" errors.
# dbt 2.0 drops `dbt docs generate`; use `compile --write-catalog` first (produces
# catalog.json), then `build` (produces manifest.json + run_results.json without
# clobbering the catalog). Explicit --profiles-dir/--project-dir for CI correctness.
[tasks.build-and-run-dbt-bouncer]
description = "Run dbt deps, compile --write-catalog, build and run dbt-bouncer"
run = [
  "uv run dbt deps --profiles-dir ./dbt_project --project-dir ./dbt_project",
  "uv run dbt compile --write-catalog --profiles-dir ./dbt_project --project-dir ./dbt_project",
  "uv run dbt build --profiles-dir ./dbt_project --project-dir ./dbt_project",
  "uv run dbt-bouncer --config-file ./dbt-bouncer-example.yml",
]

# This task uses the native dbt Fusion binary. It must be on PATH as `dbt` (the
# probe CI job installs it). Do NOT use `uv run dbt` here: that is Python dbt-core.
# The probe is manifest-only, via `dbt parse`. Catalog coverage would need a
# successful `dbt build` first, but the native Fusion engine currently fails this
# project's enforced `orders` contract: it resolves the seed integer columns to
# bigint, which mismatches the integer contract. `dbt parse` skips execution, so it
# is not affected. This still validates that dbt-bouncer accepts the manifest the
# native Fusion engine emits.
[tasks.build-and-run-dbt-bouncer-fusion]
description = "Parse the test project with the native dbt Fusion CLI and run manifest checks"
run = [
  "dbt deps --profiles-dir ./dbt_project --project-dir ./dbt_project",
  "dbt parse --profiles-dir ./dbt_project --project-dir ./dbt_project",
  "uv run dbt-bouncer --config-file ./.github/dbt-bouncer-fusion-probe.yml",
]

# Each version-specific task uses --target-path to write compiled artifacts to
# an isolated directory. The DuckDB database is NOT isolated: every task shares
# the same `path: ./dbt.duckdb` from profiles.yml. The `dbt docs generate` step
# opens that file read-write, and DuckDB takes an exclusive lock. Running the
# version builds in parallel makes them fight for that lock, so this aggregate
# runs the sub-tasks in series. This is slower but reliable. To parallelise,
# give each version its own DuckDB file first.
#
# dbt 1.10 and 1.11 are frozen alongside 1.7/1.8: their committed fixtures stay for
# backward-compat parsing coverage but are no longer rebuilt. The fixture project now
# declares semantic models in the dbt 1.12+ nested `semantic_model:` spec, which 1.10
# and 1.11 cannot parse, and schema YAML cannot be version-gated with `{% if %}`.
# Only dbt 1.12 and 2.0 are actively rebuilt.
[tasks.build-artifacts]
description = "Build dbt artifacts for testing"
run = [
  "mise run build-artifacts-112",
  "mise run build-artifacts-20",
  "mise run build-artifacts-local",
]

# `dbt build` runs first so the DuckDB database actually contains the relations.
# The catalog is produced by introspecting that database: without the build step a
# fresh clone (which has no gitignored ./dbt.duckdb) silently emits an EMPTY
# catalog.json, and every catalog check then passes vacuously.
[tasks.build-artifacts-112]
description = "Build dbt 1.12 test artifacts"
# No dbt-duckdb==1.12 yet so sticking with dbt-duckdb==1.10
run = """
PYTHON_INTERPRETER_CONSTRAINT=$(cat .python-version)
DBT_112="uvx --python ==${PYTHON_INTERPRETER_CONSTRAINT} --with dbt-duckdb~=1.10.0 --from dbt-core~=1.12.0 dbt"
$DBT_112 build --profiles-dir ./dbt_project --project-dir ./dbt_project --target-path ./target_112
$DBT_112 docs generate --profiles-dir ./dbt_project --project-dir ./dbt_project --target-path ./target_112
rm -r ./tests/fixtures/dbt_112/target || true
mv ./dbt_project/target_112 ./tests/fixtures/dbt_112/target
"""

[tasks.build-artifacts-20]
description = "Build dbt 2.0 (Fusion) test artifacts"
# dbt 2.0 drops `dbt docs generate`, so the catalog comes from `compile --write-catalog`.
# Neither command may be `dbt parse`: on dbt 2.0 a parse-only run emits no
# macro-to-macro `depends_on` edges at all, which silently breaks macro-graph checks
# such as check_macro_is_used.
#
# Three steps, because no single dbt 2.0 command writes all three artifacts:
#   build   -> populates DuckDB, writes manifest.json + a real run_results.json
#   compile -> writes catalog.json by introspecting that populated database, but
#              also rewrites run_results.json with zero results (compile executes
#              nothing), so it targets a scratch path and only catalog.json is kept.
run = """
PYTHON_INTERPRETER_CONSTRAINT=$(cat .python-version)
DBT_20="uvx --python ==${PYTHON_INTERPRETER_CONSTRAINT} --prerelease=allow --with dbt-duckdb~=1.10.0 --from dbt-core>=2.0.0b1,<3 dbt"
$DBT_20 build --profiles-dir ./dbt_project --project-dir ./dbt_project --target-path ./target_20
$DBT_20 compile --write-catalog --profiles-dir ./dbt_project --project-dir ./dbt_project --target-path ./target_20_catalog
mv ./dbt_project/target_20_catalog/catalog.json ./dbt_project/target_20/catalog.json
rm -r ./dbt_project/target_20_catalog
rm -r ./tests/fixtures/dbt_20/target || true
mkdir -p ./tests/fixtures/dbt_20
mv ./dbt_project/target_20 ./tests/fixtures/dbt_20/target
"""

[tasks.build-artifacts-local]
description = "Build local dbt test artifacts"
depends = ["install"]
# The venv now resolves dbt-core 2.0, so `docs generate` is unavailable here too.
run = [
  "uv run dbt compile --write-catalog --profiles-dir ./dbt_project --project-dir ./dbt_project",
]

[tasks.generate-rule-codes-doc]
description = "Regenerate the rule codes reference page from the check classes"
run = "uv run python scripts/generate_rule_codes_doc.py"
sources = ["src/**/*.py", "scripts/generate_rule_codes_doc.py"]
outputs = ["docs/checks/rule_codes.md"]

[tasks.generate-schema]
description = "Regenerate schema.json from Pydantic models"
run = "uv run python scripts/generate_schema.py"
sources = ["src/**/*.py", "scripts/generate_schema.py"]
outputs = ["schema.json"]

# --- Tests -------------------------------------------------------------------

[tasks.test]
description = "Run all tests (unit + integration)"
# A single pytest invocation, so `coverage.xml` / `junit.xml` describe the whole
# suite. Chaining `test-unit` then `test-integration` instead would leave the
# integration-only results (~74%) in `coverage.xml`, overwriting the combined
# figure; the per-suite tasks therefore write their own scoped report files.
run = """
uv run pytest \
	-c ./tests \
	--junitxml=junit.xml \
	--cov-report=term-missing:skip-covered \
	--cov-report=xml \
	--cov=src/dbt_bouncer/ \
	--numprocesses 5 \
	./tests/unit ./tests/integration
"""

# Necessary due to https://github.com/coveragepy/coveragepy/issues/1514
[tasks.test-dev-container]
description = "Run tests in the dev container"
run = """
uv run --extra dev pytest --numprocesses 5 ./tests/unit && \
uv run --extra dev pytest --numprocesses 5 ./tests/integration
"""

[tasks.test-integration]
description = "Run integration tests"
run = """
uv run pytest \
	-c ./tests \
	--junitxml=junit-integration.xml \
	--cov-report=term-missing:skip-covered \
	--cov-report=xml:coverage-integration.xml \
	--cov=src/dbt_bouncer/ \
	--numprocesses 5 \
	./tests/integration
"""

# Default to 1,000 models to keep local runs quick; override with e.g.
# `mise run test-benchmark --models 5000`. CI runs the PR and main branches
# at the same count, so Bencher comparisons stay apples-to-apples.
# Warm rounds (`--phase-rounds`) feed the phase-decomposition summary table;
# lower it for faster local iteration, e.g. `--phase-rounds 10`.
[tasks.test-benchmark]
description = "Run code-level performance benchmarks (pytest-benchmark)"
# No --numprocesses (xdist disables pytest-benchmark) and no --cov (skews timings).
# No -s: the phase-decomposition fixture suspends capturing itself (just for
# its own tqdm progress bar), so every other benchmark stays quiet as before.
run = '''
DBT_BOUNCER_BENCH_MODELS="$usage_models" \
DBT_BOUNCER_BENCH_PHASE_ROUNDS="$usage_phase_rounds" uv run pytest \
	-c ./tests \
	--benchmark-only \
	--benchmark-json=pytest_benchmark_results.json \
	./tests/benchmark
'''
usage = '''
flag "--models" help="Number of synthetic models to generate for the benchmark" default="1000" {
    arg <MODELS>
}
flag "--phase-rounds" help="Number of phase rounds to run" default="100" {
    arg <PHASE_ROUNDS>
}
'''

# Model counts swept by the aggregate benchmark; override with e.g.
# `mise run test-benchmark-aggregate --model-counts "100 1000 12000"`.
[tasks.test-benchmark-aggregate]
description = "Sweep the end-to-end benchmark across model counts and print a summary table"
run = '''
uv run python tests/benchmark/aggregate_benchmarks.py --models "$usage_model_counts"
'''
usage = '''
flag "--model-counts" help="Space- or comma-separated model counts to sweep" default="100 250 500 1000 2000 5000 12000" {
    arg <MODEL_COUNTS>
}
'''

[tasks.test-benchmark-chart]
description = "Generate an Altair performance density chart and display the bell curve in the terminal"
run = '''
uv run python tests/benchmark/chart_benchmarks.py \
	--models "$usage_models" \
	--phase-rounds "$usage_phase_rounds" \
	--benchmark "$usage_benchmark" \
	--output "$usage_output" \
	${usage_benchmark_rounds:+--benchmark-rounds "$usage_benchmark_rounds"} \
	${usage_json_file:+--json-file "$usage_json_file"}
'''
usage = '''
flag "--models" help="Number of synthetic models to generate for the benchmark" default="1000" {
    arg <MODELS>
}
flag "--phase-rounds" help="Number of phase rounds to run" default="50" {
    arg <PHASE_ROUNDS>
}
flag "--benchmark" help="Benchmark test name to plot (e.g. 'test_run_bouncer' or 'all')" default="test_run_bouncer" {
    arg <BENCHMARK>
}
flag "-o --output" help="Path to save the generated Altair chart HTML file" default="benchmark_chart.html" {
    arg <OUTPUT>
}
flag "--benchmark-rounds --rounds" help="Minimum number of benchmark rounds (samples) to run for pytest-benchmark" {
    arg <ROUNDS>
}
flag "--json-file" help="Path to pre-existing pytest-benchmark JSON report to plot directly" {
    arg <JSON_FILE>
}
'''

[tasks.test-perf]
description = "Run performance tests"
run = """
bencher run \
	--adapter shell_hyperfine \
	--dry-run \
	--file results.json \
	--format json \
	"hyperfine --export-json results.json --runs 10 'dbt-bouncer --config-file dbt-bouncer-example.yml'"
"""

[tasks.test-unit]
description = "Run unit tests"
run = """
uv run pytest \
	-c ./tests \
	--junitxml=junit-unit.xml \
	--cov-report=term-missing:skip-covered \
	--cov-report=xml:coverage-unit.xml \
	--cov=src/dbt_bouncer/ \
	--numprocesses 5 \
	./tests/unit
"""

[tasks.test-windows]
description = "Run tests on Windows"
run = """
uv run pytest -c ./tests --numprocesses 5 ./tests/unit && \
uv run pytest -c ./tests --numprocesses 5 ./tests/integration
"""
